services:
  db:
    image: postgres:16-alpine
    container_name: microsolu_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-microsolu}
      POSTGRES_USER: ${POSTGRES_USER:-microsolu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-microsolu_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-microsolu} -d ${POSTGRES_DB:-microsolu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: microsolu_backend
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-microsolu}
      DB_USERNAME: ${POSTGRES_USER:-microsolu}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-microsolu_secret}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./backend:/var/www/html:cached
    depends_on:
      db:
        condition: service_healthy

  webserver:
    build:
      context: ./docker/nginx
    container_name: microsolu_webserver
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:80"
    depends_on:
      - backend

# frontend service removed - running locally on port 3001

volumes:
  postgres_data:
  frontend_node_modules:
